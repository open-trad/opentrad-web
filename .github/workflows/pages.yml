name: Publish preview-only GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'open-trad/opentrad-web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Pages site
        run: pnpm build
        env:
          VITE_BASE_PATH: /opentrad-web/
          VITE_DEPLOYMENT_MODE: preview
          VITE_SERVER_FEATURES_ENABLED: "false"
      - name: Prove preview has no production API endpoint
        run: >-
          ! rg --text --fixed-strings 'opentrad.xyz/api' apps/web/dist
      - name: Add single-page fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy:
    if: github.repository == 'open-trad/opentrad-web'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
